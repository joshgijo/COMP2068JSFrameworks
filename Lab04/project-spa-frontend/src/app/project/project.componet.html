<p>project works!</p>
<div class="container mt-4">
  <h2>Project List</h2>
  <table class="table table-striped table-hover">
    <thead class="thead-dark">
      <tr>
        <th>Name</th>
        <th>Due Date</th>
        <th>Course</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let project of projects">
        <td>{{ project.name }}</td>
        <td>{{ project.dueDate }}</td>
        <td>{{ project.course }}</td>
      </tr>
    </tbody>
  </table>
</div>
