<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Name</th>
      <th>Due Date</th>
      <th>Course</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let project of projects">
      <td>{{ project.name }}</td>
      <td>{{ project.dueDate | date }}</td> 
      <td>{{ project.course }}</td>
      <td>
        <a class="btn btn-info btn-sm" (click)="selectProject(project)">Edit</a>
        <a class="btn btn-danger btn-sm" (click)="deleteProject(project._id)">Delete</a>
      </td>
    </tr>
<form (ngSubmit)="addOrUpdate()" #projectForm="ngForm" class="mb-3">
  <div class="mb-2">
    <label for="name">Name</label>
    <input id="name" name="name" class="form-control" [(ngModel)]="name" required />
  </div>

  <div class="mb-2">
    <label for="dueDate">Due Date</label>
    <input id="dueDate" name="dueDate" type="date" class="form-control" [(ngModel)]="dueDate" required />
  </div>

  <div class="mb-2">
    <label for="course">Course</label>
    <input id="course" name="course" class="form-control" [(ngModel)]="course" required />
  </div>

  <button type="button" class="btn btn-primary" (click)="addProject()" *ngIf="!_id">Save</button>
  <button type="button" class="btn btn-success" (click)="updateProject()" *ngIf="_id">Update</button>
  <button type="button" class="btn btn-secondary" (click)="clearForm()">Clear</button>
</form>

  </tbody>
</table>
